name: Mark stale issues and pull requests

on:
  schedule:
    # Run every day at 8pm UTC
    - cron: '0 20 * * *'
    workflow_dispatch: 

jobs:
  sync_fork:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork via GitHub CLI
        env:
          # You need to generate a Classic PAT with 'repo' scope 
          # and save it in this private repo's Secrets as MY_SYNC_TOKEN
          GH_TOKEN: ${{ secrets.MY_SYNC_TOKEN }} 
        run: |
          gh repo sync ramdrvcs/ocs-ci --branch master
