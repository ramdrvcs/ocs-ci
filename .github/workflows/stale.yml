name: Mark stale issues and pull requests

on:
  schedule:
    # Run every day at 8pm UTC
    - cron: '0 20 * * *'
  workflow_dispatch: 

jobs:
  sync_fork:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork via GitHub CLI
        env:
          # You need to generate a Classic PAT with 'repo' scope 
          # and save it in this private repo's Secrets as MY_SYNC_TOKEN
          GH_TOKEN: ${{ secrets.MY_SYNC_TOKEN }} 
        run: |
          gh repo sync ramdrvcs/ocs-ci --branch master
          gh repo sync ramdrvcs/ocs-ci --branch release-4.22
          gh repo sync ramdrvcs/ocs-ci --branch release-4.21
          gh repo sync ramdrvcs/ocs-ci --branch release-4.20
          gh repo sync ramdrvcs/ocs-ci --branch release-4.19
          gh repo sync ramdrvcs/ocs-ci --branch release-4.18
          gh repo sync ramdrvcs/ocs-ci --branch stable
